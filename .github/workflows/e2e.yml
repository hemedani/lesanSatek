name: Front-end E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (front-end)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/
      MONGO_DB: lesanSatek_e2e_ci
      APP_PORT: "1370"
      NEXT_PUBLIC_BACKEND_URL: http://localhost:1370
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      E2E_BACKEND_URL: http://localhost:1370
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install frontend dependencies
        working-directory: front
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: front
        run: pnpm test:e2e:install

      - name: Start the backend and seed fixtures
        run: |
          cd back
          deno run --allow-all mod.ts > /tmp/backend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:1370/playground > /dev/null; then
              echo "backend is up"
              break
            fi
            sleep 2
          done
          cd ..
          python3 ignore-scripts/_run_e2e.py --base-url http://127.0.0.1:1370

      - name: Run the E2E suite
        working-directory: front
        run: pnpm test:e2e

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            front/e2e/.report
            front/e2e/.results
          retention-days: 14
